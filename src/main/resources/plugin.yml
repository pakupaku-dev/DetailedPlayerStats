name: DetailedPlayerStats
version: ${project.version}
main: jp.pakupaku.detailedstats.DetailedPlayerStatsPlugin
api-version: '26.2'
author: pakupaku
description: MySQL detailed activity journal, daily counters and imported lifetime statistics
softdepend: [WorldStateSync]
commands:
  detailedstats:
    description: Statistics recording status, flush and historical import
    usage: /detailedstats <status|flush|import>
    aliases: [dstats]
    permission: detailedstats.admin
permissions:
  detailedstats.admin:
    default: op
